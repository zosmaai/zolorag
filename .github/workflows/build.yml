# Builds ZoloRAG for macOS, Windows, and Linux via GitHub Actions.
# Each platform runs on its own native runner.
# Artifacts are uploaded and can be downloaded from the Actions page.

name: "Build ZoloRAG"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # allows manual trigger from Actions tab

jobs:
  # ── macOS ──
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app bundle (macOS, unsigned)
        run: pnpm tauri build --no-sign

      - name: Ad-hoc sign the app bundle
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/ZoloRAG.app"
          if [ -d "$APP_PATH" ]; then
            echo "Ad-hoc signing $APP_PATH..."
            codesign --force --deep --verify --verbose -s - "$APP_PATH"
            codesign --verify --verbose=4 "$APP_PATH"
          else
            echo "App not found at $APP_PATH"
            ls -la src-tauri/target/release/bundle/ 2>/dev/null || true
            exit 1
          fi

      - name: Package into DMG
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/ZoloRAG.app"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          DMG_PATH="$DMG_DIR/ZoloRAG_0.1.0_aarch64.dmg"
          
          # Create temporary directory for DMG contents
          TMP_DMG="/tmp/ZoloRAG_dmg"
          mkdir -p "$TMP_DMG"
          cp -R "$APP_PATH" "$TMP_DMG/"
          ln -s /Applications "$TMP_DMG/Applications"
          
          # Create the DMG
          hdiutil create -volname "ZoloRAG" -srcfolder "$TMP_DMG" \
            -ov -format UDZO -imagekey zlib-level=9 "$DMG_PATH"
          
          rm -rf "$TMP_DMG"
          echo "DMG created at: $DMG_PATH"
          ls -lh "$DMG_PATH"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ZoloRAG-macOS
          path: src-tauri/target/release/bundle/dmg/ZoloRAG_0.1.0_aarch64.dmg
          compression-level: 0

  # ── Windows ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri (Windows)
        run: pnpm tauri build --bundles nsis
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          CMAKE_MSVC_RUNTIME_LIBRARY: "MultiThreaded"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ZoloRAG-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  # ── Linux ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (WebKit, GTK, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri (Linux)
        run: pnpm tauri build --bundles deb,appimage

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ZoloRAG-Linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ZoloRAG-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
