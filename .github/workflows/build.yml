# Builds ZoloRAG for macOS, Windows, and Linux via GitHub Actions.
# Each platform runs on its own native runner.
# Artifacts are uploaded and can be downloaded from the Actions page.

name: "Build ZoloRAG"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # allows manual trigger from Actions tab

jobs:
  # ── macOS ──
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri (macOS)
        run: pnpm tauri build --bundles dmg
        env:
          TAURI_SIGNING_IDENTITY: "-"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ZoloRAG-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg

  # ── Windows ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri (Windows)
        run: pnpm tauri build --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ZoloRAG-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  # ── Linux ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (WebKit, GTK, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri (Linux)
        run: pnpm tauri build --bundles deb,appimage

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ZoloRAG-Linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ZoloRAG-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
