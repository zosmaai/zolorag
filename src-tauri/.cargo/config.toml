# ─── macOS → Windows cross-compilation ────────────────────────────────────────
[target.x86_64-pc-windows-gnu]
linker = "/opt/homebrew/bin/x86_64-w64-mingw32-gcc"
ar     = "/opt/homebrew/bin/x86_64-w64-mingw32-ar"

# ─── Android cross-compilation ────────────────────────────────────────────────
#
# Tauri calls plain `cargo build --target aarch64-linux-android` (not cargo-ndk),
# so we must configure the full toolchain here.  Without this, cc-rs and cmake
# can't find the Android cross-compiler and llama-cpp-sys-2's build.rs panics.
#
# All paths point to the NDK installed via homebrew:
#   /opt/homebrew/share/android-commandlinetools/ndk/29.0.14206865
#
# force = false (default): shell env takes precedence if the var is already set.
# Update the NDK version in all paths below if you upgrade the NDK.

[env]
# ── NDK root (checked by llama-cpp-sys-2 build.rs) ──
ANDROID_NDK      = "/opt/homebrew/share/android-commandlinetools/ndk/29.0.14206865"
NDK_ROOT         = "/opt/homebrew/share/android-commandlinetools/ndk/29.0.14206865"
ANDROID_NDK_ROOT = "/opt/homebrew/share/android-commandlinetools/ndk/29.0.14206865"

# ── C/C++ cross-compiler (checked by cc-rs for native deps) ──
CC_aarch64_linux_android  = "/opt/homebrew/share/android-commandlinetools/ndk/29.0.14206865/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android24-clang"
CXX_aarch64_linux_android = "/opt/homebrew/share/android-commandlinetools/ndk/29.0.14206865/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android24-clang++"
AR_aarch64_linux_android  = "/opt/homebrew/share/android-commandlinetools/ndk/29.0.14206865/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"

# ─── Android target flags ─────────────────────────────────────────────────────
[target.aarch64-linux-android]
# Linker for Rust crates (rustc uses this for the final link step)
linker = "/opt/homebrew/share/android-commandlinetools/ndk/29.0.14206865/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android24-clang"

# +fp16: required for gemm-f16 (candle dependency) — prevents runtime crash
rustflags = ["-C", "target-feature=+fp16"]

# ─── POSIX_MADV patch reminder ─────────────────────────────────────────────────
# Run `bash scripts/setup-android.sh` once after cloning or after `cargo update`
# to patch llama-cpp-sys-2 in ~/.cargo/registry.
# DO NOT set CFLAGS/CXXFLAGS in the shell — parentheses in -Dposix_madvise(...)
# break cmake on macOS.
