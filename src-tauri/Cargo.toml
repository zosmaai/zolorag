[package]
name = "zolo-rag"
version = "0.1.0"
description = "Local PDF Chat — drag, drop, and ask questions about your documents."
authors = ["Shanvit Shetty"]
edition = "2021"
default-run = "zolo-rag"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zolo_rag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
pdf-extract = "0.7"
lopdf = "0.34"
unicode-segmentation = "1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
bincode = "1"
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true }
dirs-next = "2"
tokio = { version = "1", features = ["rt", "macros"] }
llama-cpp-2 = { version = "0.1.146", optional = true }
encoding_rs = "0.8"

[features]
default = ["ml"]
ml = [
    "candle-core",
    "candle-nn",
    "candle-transformers",
    "tokenizers",
    "llama-cpp-2",
]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }



